# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
#
# Security model
# --------------
# Linting runs untrusted repository content inside third-party linter images, so
# the "MegaLinter" job holds no write access to repository contents and checks
# the code out without persisting git credentials.
#
# Auto-fixes are still applied, but the authenticated write-back is isolated in a
# separate "apply-fixes" job that never executes linters. It only replays a patch
# produced by the lint job, and only for same-repository pull requests. Pull
# requests from forks keep the read-only path: the lint job reports findings and
# the write-back job is skipped.
---
name: MegaLinter

# Trigger mega-linter at every push. Action will also be visible from Pull
# Requests to main
on:
  # Comment this line to trigger action only on pull-requests
  # (not recommended if you don't pay for GH Actions)
  push:

  pull_request:
    branches:
      - main
      - master

# Comment env block if you do not want to apply fixes
env:
  # Apply linter fixes configuration
  #
  # When active, APPLY_FIXES must also be defined as environment variable
  # (in github/workflows/mega-linter.yml or other CI tool)
  APPLY_FIXES: all

  # Decide which event triggers application of fixes in a commit or a PR
  # (pull_request, push, all)
  APPLY_FIXES_EVENT: pull_request

  # If APPLY_FIXES is used, fixes are committed back to the source branch.
  # Only "commit" is supported by this workflow.
  APPLY_FIXES_MODE: commit

# Only supersede in-flight runs for the same pull request. Pushes to branches
# (including main) are allowed to finish so an auto-fix write-back is never
# cancelled halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Untrusted linter execution phase: no write access to repository contents.
    # pull-requests:write is the single endpoint MegaLinter actually calls, to
    # post its report as a pull request comment.
    permissions:
      contents: read
      pull-requests: write

    outputs:
      apply_fixes: ${{ steps.patch.outputs.apply_fixes }}

    steps:

      # Git Checkout
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave a pushable git credential on disk while third-party
          # linter images run against this checkout.
          persist-credentials: false

          # If you use VALIDATE_ALL_CODEBASE = true, you can remove this line to
          # improve performance
          fetch-depth: 0

      # MegaLinter
      - name: MegaLinter

        # You can override MegaLinter flavor used to have faster performances
        # More info at https://megalinter.io/flavors/
        uses: oxsecurity/megalinter/flavors/dotnet@7e042c726c68415475b05a65a686c612120a1232 # v7.7.0

        id: ml

        # All available variables are described in documentation
        # https://megalinter.io/configuration/
        env:

          # Validates all source when push on main, else just the git diff with
          # main. Override with true if you always want to lint all sources
          #
          # To validate the entire codebase, set to:
          # VALIDATE_ALL_CODEBASE: true
          #
          # To validate only diff with main, set to:
          # VALIDATE_ALL_CODEBASE: >-
          #   ${{
          #     github.event_name == 'push' &&
          #     contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
          #   }}
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
            }}

          # Read-only token in this job; used for the pull request report comment.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ADD YOUR CUSTOM ENV VARIABLES HERE OR DEFINE THEM IN A FILE
          # .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY

          # Uncomment to disable copy-paste and spell checks
          # DISABLE: COPYPASTE,SPELL
          #
          # DISABLE_ERRORS keeps every linter non-blocking. This is deliberate and
          # pre-existing: the repository has never been linted against a clean
          # baseline, so flipping it here would turn unrelated historical findings
          # into merge blockers. Re-enable per linter with DISABLE_ERRORS_LINTERS
          # once a given linter is verified green.
          DISABLE_ERRORS: true
          DISABLE_LINTERS: SPELL_LYCHEE
          # Uncomment DISABLE_ERRORS_LINTERS if you want to turn errors back on selectively.
          # DISABLE_ERRORS_LINTERS: REPOSITORY_DEVSKIM,REPOSITORY_KICS,REPOSITORY_CHECKOV,POWERSHELL_POWERSHELL,SPELL_CSPELL

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log

      # MegaLinter runs as root inside its container and can leave .git owned by
      # root, which breaks the git commands used to capture the fixes.
      - name: Reclaim ownership of the git directory
        if: steps.ml.outputs.has_updated_sources == 1
        run: sudo chown -Rc "${UID}" .git/

      # Capture the auto-fixes as a patch instead of pushing them from this job.
      # Workflow files are excluded on purpose: GITHUB_TOKEN cannot push changes
      # under .github/workflows, and this keeps linter output from ever rewriting
      # the privileged part of the repository.
      - name: Capture linter fixes as a patch
        id: patch
        if: steps.ml.outputs.has_updated_sources == 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_SAME_REPO: >-
            ${{
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            }}
          IS_PROTECTED_REF: >-
            ${{ contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref) }}
        run: |
          set -euo pipefail

          apply_fixes="false"
          if [ "${APPLY_FIXES}" = "none" ]; then
            echo "APPLY_FIXES is disabled; not writing fixes back."
          elif [ "${APPLY_FIXES_MODE}" != "commit" ]; then
            echo "::warning::APPLY_FIXES_MODE='${APPLY_FIXES_MODE}' is not supported by this workflow; only 'commit' writes fixes back."
          elif [ "${APPLY_FIXES_EVENT}" != "all" ] && [ "${APPLY_FIXES_EVENT}" != "${EVENT_NAME}" ]; then
            echo "Event '${EVENT_NAME}' does not match APPLY_FIXES_EVENT='${APPLY_FIXES_EVENT}'."
          elif [ "${IS_SAME_REPO}" != "true" ]; then
            echo "Pull request originates from a fork; keeping this run read-only."
          elif [ "${IS_PROTECTED_REF}" = "true" ]; then
            echo "Refusing to commit fixes directly to a protected default branch."
          else
            apply_fixes="true"
          fi

          if [ "${apply_fixes}" = "true" ]; then
            git add -A -- . \
              ':(exclude).github/workflows' \
              ':(exclude)megalinter-reports' \
              ':(exclude)mega-linter.log'
            git diff --cached --binary > "${RUNNER_TEMP}/megalinter-fixes.patch"
            if [ ! -s "${RUNNER_TEMP}/megalinter-fixes.patch" ]; then
              echo "No committable changes remain after exclusions."
              apply_fixes="false"
            fi
          fi

          echo "apply_fixes=${apply_fixes}" >> "${GITHUB_OUTPUT}"

      - name: Upload linter fixes patch
        if: steps.patch.outputs.apply_fixes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: megalinter-fixes-patch
          path: ${{ runner.temp }}/megalinter-fixes.patch
          retention-days: 1
          if-no-files-found: error

  # Authenticated write-back phase. No linter runs here: the job only replays the
  # patch produced above onto the source branch of a same-repository pull request.
  apply-fixes:
    name: Apply MegaLinter fixes
    needs: megalinter
    if: needs.megalinter.outputs.apply_fixes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout the branch to fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Guarded by apply_fixes: always the head branch of a same-repository
          # pull request, or a non-default branch push.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          # Credentials are required here so git-auto-commit-action can push.
          # GITHUB_TOKEN is used on purpose instead of a PAT: pushes made with it
          # do not re-trigger workflows, which prevents an auto-fix commit loop.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download linter fixes patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: megalinter-fixes-patch
          path: ${{ runner.temp }}/megalinter-patch

      - name: Apply linter fixes patch
        env:
          PATCH_FILE: ${{ runner.temp }}/megalinter-patch/megalinter-fixes.patch
        run: |
          set -euo pipefail

          test -s "${PATCH_FILE}"

          # Defence in depth: the lint job already excludes workflow files, so a
          # patch that touches them means something unexpected happened.
          if git apply --numstat "${PATCH_FILE}" | cut -f3- | grep -q '^\.github/workflows/'; then
            echo "::error::Refusing to apply a patch that modifies workflow files."
            exit 1
          fi

          git apply --whitespace=nowarn "${PATCH_FILE}"
          git status --short

      - name: Commit and push applied linter fixes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          commit_message: "[MegaLinter] Apply linters fixes"
          commit_user_name: megalinter-bot
          commit_user_email: samuel.erde@gmail.com
